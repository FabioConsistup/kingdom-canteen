# Cloudflare Workers + Static Assets.
#
# Painel do Cloudflare:
#   Build command  -> npm run build
#   Deploy command -> npx wrangler deploy
#
# EMAIL_API_KEY, EMAIL_FROM e EMAIL_TO NÃO ficam aqui: são cadastradas no
# painel do Cloudflare em Settings -> Variables and Secrets (como Secret).
name = "kingdom-canteen"
main = "./worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Só as rotas de API executam o Worker; o restante é servido como asset estático.
run_worker_first = ["/api/*"]
